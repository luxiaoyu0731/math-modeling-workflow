name: Workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s workflow/tests -v
      - run: python -B -m unittest discover -s tests -v
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-documents.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-noto-cjk
      - run: python -B -m unittest discover -s tests -v
      - run: python tests/smoke_render.py --format docx
