name: Workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s workflow/tests -v
      - run: python -B -m unittest discover -s tests -v
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-documents.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-noto-cjk
      - run: python -B -m unittest discover -s tests -v
      - run: python tests/smoke_render.py --format docx

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-documents.txt
      - run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-lang-chinese fonts-noto-cjk
      - run: python tests/smoke_render.py --format latex
      - run: python examples/create_demo.py --destination ../native-demo --mode existing_tex
      - run: python scripts/paper.py --project ../native-demo audit
      - run: python scripts/paper.py --project ../native-demo build --formats latex
      - run: python scripts/paper.py --project ../native-demo render --format latex
  release-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_check.py --git . --mode tracked
      - run: python scripts/release_check.py --git . --mode history
      - run: python scripts/package.py archive --output ../workflow.zip

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python scripts/test-release.py
